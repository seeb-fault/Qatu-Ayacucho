# Prueba de carga progresiva hasta 2 000 usuarios virtuales con k6 (Sprint 2, AC01 y AC03).
# Corre a pedido (Actions → Carga k6 → Run workflow) o al subir una rama carga/**. Dos trabajos en paralelo, en
# máquinas separadas: la API sin caché y con caché de 30 s, para medir el efecto de la estrategia de caché.
# En cada máquina corren PostgreSQL, la API (un proceso de Node) y k6: compiten por la CPU, como se informa.
name: Carga k6

on:
  workflow_dispatch:
    inputs:
      rapido:
        description: 'Corrida corta de prueba (20 s por escalón)'
        type: boolean
        default: false
  push:
    branches: ['carga/**']

permissions:
  contents: read

jobs:
  carga:
    name: k6 hasta 2 000 usuarios (caché ${{ matrix.cache }} s)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cache: ['0', '30']
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: qatu
          POSTGRES_PASSWORD: qatu_carga
          POSTGRES_DB: qatu_carga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qatu -d qatu_carga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qatu:qatu_carga@127.0.0.1:5432/qatu_carga_test
      JWT_SECRET: secreto-solo-para-la-prueba-de-carga-en-ci-qatu-2026
      APP_ORIGIN: http://127.0.0.1:3100
      NODE_ENV: test
      PORT: '3402'
      QATU_DESPACHO_EVENTOS: inactivo
      QATU_PAGOS: doble
      QATU_CACHE_SEGUNDOS: ${{ matrix.cache }}
      SALIDA: ${{ github.workspace }}/resultado
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar, migrar y compilar
        working-directory: backend
        run: |
          npm ci
          npm run migrate
          npm run build
      - name: Datos sintéticos (100 proveedores, 1 000 publicaciones, 5 000 reservas)
        working-directory: backend
        run: |
          mkdir -p "$SALIDA"
          node --import tsx test/carga/datos-carga.ts > "$RUNNER_TEMP/datos.json"
      - name: Arrancar la API y medir CPU y memoria cada 5 s
        working-directory: backend
        run: |
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:$PORT/api/v1/salud > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:$PORT/api/v1/salud
          PG=$(docker ps -q --filter ancestor=postgis/postgis:17-3.5)
          echo "hora,api_cpu_pct,api_memoria_mb,postgres_cpu,postgres_memoria" > "$SALIDA/recursos.csv"
          nohup bash -c "while sleep 5; do echo \"\$(date -u +%FT%TZ),\$(ps -o %cpu= -o rss= -p $(cat $RUNNER_TEMP/api.pid) | awk '{printf \"%s,%d\", \$1, \$2/1024}'),\$(docker stats --no-stream --format '{{.CPUPerc}},{{.MemUsage}}' $PG | cut -d/ -f1)\" >> \"$SALIDA/recursos.csv\"; done" > /dev/null 2>&1 &
      - name: k6 2.4.0 con escalones de 100 a 2 000 usuarios
        run: |
          ulimit -n 65536 || true
          # Una meta incumplida (código 99) es un resultado, no un fallo del workflow: se guarda y se informa.
          set +e
          docker run --rm --network host --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE/docs/06-pruebas-atributos-calidad/scripts:/scripts:ro" -v "$RUNNER_TEMP:/datos:ro" -v "$SALIDA:/salida" \
            grafana/k6:2.4.0 run -e API=http://127.0.0.1:$PORT -e DATOS=/datos/datos.json -e ORIGEN=$APP_ORIGIN -e PERFIL=2000 \
            -e SALIDA=/salida/resumen-k6.json ${{ inputs.rapido && '-e RAPIDO=1' || '' }} --quiet /scripts/carga.k6.js > "$SALIDA/k6.txt" 2>&1
          codigo=$?
          cat "$SALIDA/k6.txt"
          echo "Código de k6: $codigo (0 = todas las metas se cumplieron; 99 = alguna no)" | tee -a "$SALIDA/k6.txt"
          [ "$codigo" -eq 0 ] || [ "$codigo" -eq 99 ]
      - name: Entorno de la medición
        if: always()
        run: |
          node -e "const os=require('os');console.log(JSON.stringify({fecha:new Date().toISOString(),maquina:'GitHub Actions ubuntu-24.04',cpu:os.cpus()[0].model,nucleos:os.cpus().length,memoria_gb:Math.round(os.totalmem()/1e9),node:process.version,k6:'2.4.0',cache_segundos:Number(process.env.QATU_CACHE_SEGUNDOS),nota:'PostgreSQL, la API (un proceso de Node) y k6 en la misma máquina.'},null,2))" > "$SALIDA/entorno.json"
          tail -n 50 "$RUNNER_TEMP/api.log" | grep -v -i "cookie\|password" > "$SALIDA/api-final.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: carga-2000-cache-${{ matrix.cache }}
          path: resultado/
          retention-days: 30
